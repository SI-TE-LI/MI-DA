<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SCP基金会 - 页面整合</title>
<style>
    /* ================= 基础设置 ================= */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background-color: #f4f4f4; /* 整个网页的浅灰色背景，为了衬托白色的圆角盒子 */
    }

    /* ================= 1. 顶部页头部分 ================= */
    .site-header {
        background: linear-gradient(to bottom, #1a0000 0%, #4a0000 60%, #2a0000 100%);
        color: #ffffff;
        border-bottom: 2px solid #000;
    }

    /* 最顶部的用户栏 */
    .top-bar {
        display: flex;
        justify-content: flex-end; 
        padding: 8px 40px;
        font-size: 12px;
        background-color: rgba(0, 0, 0, 0.4);
    }
    .top-bar a {
        color: #cccccc;
        text-decoration: none;
        margin-left: 5px;
    }
    .top-bar a:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* 主视觉区（Logo + 标题 + 搜索框） */
    .header-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 40px;
        max-width: 1200px;
        margin: 0 auto; 
    }
    .logo-area {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .logo-placeholder {
        width: 80px;
        height: 80px;
        background-color: #fff;
        border-radius: 50%;
        border: 3px solid #000;
        /* 实际使用时，请把这里换成 <img src="你的logo.png" width="80"> */
    }
    .title-group {
        display: flex;
        flex-direction: column;
    }
    .title-group h1 {
        font-size: 32px;
        letter-spacing: 2px;
        margin-bottom: 5px;
    }
    .title-group .slogan {
        font-size: 14px;
        color: #cccccc;
        letter-spacing: 1px;
    }
    .search-area {
        display: flex;
        gap: 5px;
    }
    .search-area input {
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid #800000;
        color: #ffffff;
        padding: 6px 10px;
        outline: none;
        font-size: 13px;
        width: 180px;
    }
    .search-area input::placeholder {
        color: #888;
    }
    .search-area button {
        background-color: #800000;
        color: #ffffff;
        border: 1px solid #800000;
        padding: 6px 15px;
        cursor: pointer;
        font-size: 13px;
    }
    .search-area button:hover {
        background-color: #a00000;
    }

    /* 底部导航栏 */
    .main-nav {
        background-color: #2b2b2b;
        display: flex;
        justify-content: flex-end;
        padding: 0 40px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .main-nav a {
        color: #dddddd;
        text-decoration: none;
        padding: 12px 20px;
        font-size: 14px;
        display: block;
    }
    .main-nav a:hover {
        background-color: #800000;
        color: #ffffff;
    }

    /* ================= 2. 下方主要内容区（圆弧长方形） ================= */
    .content-wrapper {
        padding: 40px 20px; /* 给内容区上下左右留出空间，让它与页头有距离 */
    }
    
    .rounded-box {
        width: 800px;              /* 盒子的宽度 */
        max-width: 100%;           /* 手机端不溢出 */
        margin: 0 auto;            /* 核心：水平居中 */
        background-color: #ffffff; 
        border: 1px solid #dcdcdc; 
        border-radius: 12px;       /* 圆弧 */
        padding: 30px 40px;        
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* 稍微加深一点阴影，更有层次感 */
    }

    /* 盒子内部文字样式 */
    .rounded-box h1 {
        margin-top: 0;
        font-size: 24px;
        border-bottom: 2px solid #cc0000;
        padding-bottom: 10px;
        color: #222;
    }
    .rounded-box p {
        line-height: 1.8;
        font-size: 15px;
        color: #333;
        margin-bottom: 10px;
    }
    .rounded-box a {
        color: #cc0000;
        text-decoration: none;
    }
    .rounded-box a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

    <!-- 第一部分：顶部页头 -->
    <header class="site-header">
        <div class="top-bar">
            <a href="#">建立账户</a> 或 <a href="#">登入</a>
        </div>

        <div class="header-main">
            <div class="logo-area">
                <div class="logo-placeholder"></div> 
                <div class="title-group">
                    <h1>SCP基金会</h1>
                    <div class="slogan">控制，收容，保护</div>
                </div>
            </div>

            <div class="search-area">
                <input type="text" placeholder="搜索网站">
                <button>搜索</button>
            </div>
        </div>

        <nav class="main-nav">
            <a href="#">SCP系列</a>
            <a href="#">故事</a>
            <a href="#">图书馆</a>
            <a href="#">SCP-CN系列</a>
            <a href="#">SCP国际</a>
            <a href="#">背景资料</a>
            <a href="#">指导</a>
        </nav>
    </header>

    <!-- 第二部分：下方主要内容区 -->
    <main class="content-wrapper">
        <!-- ⭐ 你之前想要的圆弧长方形 -->
        <div class="rounded-box">
            <h1>SCP-001</h1>
            <p><strong>项目等级：</strong>Euclid</p>
            <p><strong>特殊收容措施：</strong>这里写收容措施。</p>
            <p><strong>描述：</strong>这里写描述。</p>
            <br>
            <p><a href="辰/001.html">001</a></p>
            <p><a href="index.html">返回首页</a></p>
        </div>
    </main>

</body>
</html>
