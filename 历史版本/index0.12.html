<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>SCP基金会 - 顶部页头</title>
<style>
    /* 1. 清除默认边距，设置基础字体 */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background-color: #f4f4f4; /* 网页主体浅灰色背景 */
    }

    /* 2. 整个页头容器：带有黑红色的渐变背景 */
    .site-header {
        background: linear-gradient(to bottom, #1a0000 0%, #4a0000 60%, #2a0000 100%);
        color: #ffffff;
        border-bottom: 2px solid #000;
    }

    /* ========== 第一部分：最顶部的用户栏 ========== */
    .top-bar {
        display: flex;
        justify-content: flex-end; /* 靠右对齐 */
        padding: 8px 40px;
        font-size: 12px;
        background-color: rgba(0, 0, 0, 0.4); /* 半透明黑色底色 */
    }
    .top-bar a {
        color: #cccccc;
        text-decoration: none;
        margin-left: 5px;
    }
    .top-bar a:hover {
        color: #ffffff;
        text-decoration: underline;
    }

    /* ========== 第二部分：主视觉区（Logo + 标题 + 搜索框） ========== */
    .header-main {
        display: flex;
        justify-content: space-between; /* 左右两端对齐 */
        align-items: center; /* 垂直居中对齐 */
        padding: 30px 40px;
        max-width: 1200px; /* 限制内容最大宽度，防止在大屏幕太散 */
        margin: 0 auto;    /* 居中 */
    }

    /* 左侧 Logo 和文字区域 */
    .logo-area {
        display: flex;
        align-items: center;
        gap: 20px; /* Logo 和文字的间距 */
    }
    /* 这里用一个小圆圈模拟你的 Logo，实际使用时换成你的 <img> 标签 */
    .logo-placeholder {
        width: 80px;
        height: 80px;
        background-color: #fff;
        border-radius: 50%;
        border: 3px solid #000;
        /* 只是一个占位符，你可以替换为 <img src="你的logo图片路径.png" width="80"> */
    }
    .title-group {
        display: flex;
        flex-direction: column;
    }
    .title-group h1 {
        font-size: 32px;
        letter-spacing: 2px;
        margin-bottom: 5px;
    }
    .title-group .slogan {
        font-size: 14px;
        color: #cccccc;
        letter-spacing: 1px;
    }

    /* 右侧搜索区域 */
    .search-area {
        display: flex;
        gap: 5px;
    }
    .search-area input {
        background-color: rgba(0, 0, 0, 0.5);
        border: 1px solid #800000; /* 深红色边框 */
        color: #ffffff;
        padding: 6px 10px;
        outline: none;
        font-size: 13px;
        width: 180px;
    }
    .search-area input::placeholder {
        color: #888;
    }
    .search-area button {
        background-color: #800000; /* 深红色按钮 */
        color: #ffffff;
        border: 1px solid #800000;
        padding: 6px 15px;
        cursor: pointer;
        font-size: 13px;
    }
    .search-area button:hover {
        background-color: #a00000;
    }

    /* ========== 第三部分：底部导航栏 ========== */
    .main-nav {
        background-color: #2b2b2b;
        display: flex;
        justify-content: flex-end; /* 导航链接靠右 */
        padding: 0 40px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .main-nav a {
        color: #dddddd;
        text-decoration: none;
        padding: 12px 20px;
        font-size: 14px;
        display: block;
    }
    .main-nav a:hover {
        background-color: #800000; /* 鼠标悬停时出现深红色背景 */
        color: #ffffff;
    }
</style>
</head>
<body>

    <!-- 整个顶部页头 -->
    <header class="site-header">
        
        <!-- 第一部分：最顶部用户栏 -->
        <div class="top-bar">
            <a href="#">建立账户</a> 或 <a href="#">登入</a>
        </div>

        <!-- 第二部分：主视觉区 -->
        <div class="header-main">
            <!-- 左侧 Logo 和标题 -->
            <div class="logo-area">
                <!-- 这里的 div 你换成自己的图片，例如： <img src="logo.png" alt="SCP Logo" width="80"> -->
                <div class="logo-placeholder"></div> 
                <div class="title-group">
                    <h1>SCP基金会</h1>
                    <div class="slogan">控制，收容，保护</div>
                </div>
            </div>

            <!-- 右侧搜索框 -->
            <div class="search-area">
                <input type="text" placeholder="搜索网站">
                <button>搜索</button>
            </div>
        </div>

        <!-- 第三部分：底部导航栏 -->
        <nav class="main-nav">
            <a href="#">SCP系列</a>
            <a href="#">故事</a>
            <a href="#">图书馆</a>
            <a href="#">SCP-CN系列</a>
            <a href="#">SCP国际</a>
            <a href="#">背景资料</a>
            <a href="#">指导</a>
        </nav>

    </header>

</body>
</html>
